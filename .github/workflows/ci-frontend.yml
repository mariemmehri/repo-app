name: CI Frontend - Build and Push

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read
  id-token: write

env:
  FRONTEND_IMAGE: hr-frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 - Frontend : build + upload dist
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2 - Docker Build and Push to GCP Artifact Registry
  # ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # ── Authentification GCP via OIDC ─────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Frontend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }} \
            ./frontend

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push Frontend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3 - Deploy : patch le values file GitOps selon la branche
  #   develop -> values-dev.yaml   (namespace dev)
  #   main    -> values-staging.yaml (namespace staging)
  #   (prod est promu par tag via promote-prod.yml, jamais ici)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy - Update GitOps config
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && success()
    env:
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}

    steps:
      - name: Resolve target environment
        id: target
        run: |
          case "${{ github.ref }}" in
            refs/heads/develop)
              echo "values_file=charts/hr-app/values-dev.yaml" >> "$GITHUB_OUTPUT"
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main)
              echo "values_file=charts/hr-app/values-staging.yaml" >> "$GITHUB_OUTPUT"
              echo "environment=staging" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Branche non mappée à un environnement: ${{ github.ref }}"
              exit 1
              ;;
          esac

      # ── Authentification GCP via OIDC ─────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      # ── Token GitHub App (remplace le GH_PAT) — scopé repo-config,
      # expire en 1h, révoqué automatiquement en fin de job ──────
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mariemmehri
          repositories: repo-config

      - name: Update frontend image tag in repo-config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_REPO: ${{ vars.CONFIG_REPO }}
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
          VALUES_FILE: ${{ steps.target.outputs.values_file }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
          GIT_USER_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_USER_NAME: "github-actions[bot]"

        run: |
          set -euo pipefail

          echo "Deploying frontend IMAGE_TAG=$IMAGE_TAG to environment=$TARGET_ENV (${VALUES_FILE})"

          echo "Checking frontend image..."
          gcloud artifacts docker tags list \
            ${REGISTRY}/${{ env.FRONTEND_IMAGE }} \
            --filter="tag:${IMAGE_TAG}" \
            --format="value(tag)" | grep -q "${IMAGE_TAG}"
          echo "Frontend image exists ✔"

          git clone --depth 1 \
            https://x-access-token:${GH_TOKEN}@github.com/${CONFIG_REPO}.git \
            config-repo
          cd config-repo

          git config user.email "${GIT_USER_EMAIL}"
          git config user.name "${GIT_USER_NAME}"

          # retry on push conflict: ci-backend.yml may be updating the
          # same values file concurrently when both sides change together
          for attempt in 1 2 3 4 5; do
            yq eval '.frontend.image.tag = strenv(IMAGE_TAG)' -i ${VALUES_FILE}

            echo "Updated frontend.image.tag:"
            yq eval '.frontend.image.tag' ${VALUES_FILE}

            git add ${VALUES_FILE}

            if git diff --cached --quiet; then
              echo "No changes"
              break
            fi

            git commit -m "ci: update ${TARGET_ENV} frontend image tag to ${IMAGE_TAG}"

            if git push origin HEAD:main; then
              echo "GitOps update completed ✔ (${TARGET_ENV})"
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push after 5 attempts (concurrent update from ci-backend?)"
              exit 1
            fi

            echo "Push rejected, retrying ($attempt/5)..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 3))
          done

name: Promote to Production

# Déclenché par un tag de version posé sur un commit déjà déployé en
# staging par ci-backend.yml / ci-frontend.yml. Aucun rebuild ici —
# les images promues sont celles ACTUELLEMENT référencées dans
# values-staging.yaml (source de vérité de ce qui tourne en staging),
# pas "le SHA du commit taggé" : depuis que build/push sont scopés
# par path (backend/**, frontend/**), un même commit ne garantit plus
# qu'une image existe pour les DEUX services à son propre SHA — l'un
# des deux peut dater d'un commit antérieur. Chaque image est copiée
# telle quelle (digest préservé via crane) vers le registre prod, puis
# values-prod.yaml est patché. Le déploiement réel reste soumis au
# sync manuel de l'Application ArgoCD hr-prod.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

env:
  BACKEND_IMAGE: hr-backend
  FRONTEND_IMAGE: hr-frontend
  CRANE_VERSION: v0.20.2

jobs:
  promote:
    name: Promote image to prod registry
    runs-on: ubuntu-latest
    # Gate humain n°1 : reviewers obligatoires sur l'Environment GitHub
    # "production" (Settings > Environments). Gate n°2 : sync manuel ArgoCD.
    environment: production
    env:
      SRC_REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
      PROD_REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_PROD_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authentification GCP via OIDC ─────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      # ── Token GitHub App (remplace le GH_PAT) — scopé repo-config,
      # expire en 1h, révoqué automatiquement en fin de job ──────
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mariemmehri
          repositories: repo-config

      - name: Clone repo-config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_REPO: ${{ vars.CONFIG_REPO }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${GH_TOKEN}@github.com/${CONFIG_REPO}.git \
            config-repo

      # ── Résout les tags à promouvoir depuis ce qui tourne VRAIMENT
      # en staging, pas depuis le SHA du commit taggé (voir commentaire
      # en tête de fichier) ──────────────────────────────────────
      - name: Resolve source image tags from staging values
        id: src
        run: |
          set -euo pipefail
          BACKEND_TAG=$(yq eval '.backend.image.tag' config-repo/charts/hr-app/values-staging.yaml)
          FRONTEND_TAG=$(yq eval '.frontend.image.tag' config-repo/charts/hr-app/values-staging.yaml)
          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${{ env.BACKEND_IMAGE }}@${BACKEND_TAG} + ${{ env.FRONTEND_IMAGE }}@${FRONTEND_TAG} (from staging) as ${GITHUB_REF_NAME}"

      # ── Garde-fou build-once : chaque image DOIT déjà exister,
      # chacune à son propre tag ──────────────────────────────────
      - name: Verify images exist in source registry (no rebuild)
        env:
          BACKEND_TAG: ${{ steps.src.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.src.outputs.frontend_tag }}
        run: |
          set -euo pipefail
          check() {
            local image="$1" tag="$2"
            echo "Checking ${image}:${tag}..."
            gcloud artifacts docker tags list \
              ${{ env.SRC_REGISTRY }}/${image} \
              --filter="tag:${tag}" \
              --format="value(tag)" | grep -q "${tag}" || {
                echo "::error::Image ${image}:${tag} introuvable dans ${{ env.SRC_REGISTRY }}."
                echo "::error::values-staging.yaml pointe vers un tag jamais buildé/poussé pour ${image} — vérifie le déploiement staging avant de re-tagger."
                exit 1
              }
            echo "${image}:${tag} exists ✔"
          }
          check "${{ env.BACKEND_IMAGE }}" "${BACKEND_TAG}"
          check "${{ env.FRONTEND_IMAGE }}" "${FRONTEND_TAG}"

      - name: Install crane
        run: |
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${{ env.CRANE_VERSION }}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin crane
          crane version

      # ── Copie vers le registre prod (digest préservé), chaque
      # image depuis son propre tag source ──────────────────────
      - name: Copy images to prod registry
        env:
          BACKEND_TAG: ${{ steps.src.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.src.outputs.frontend_tag }}
          VERSION: ${{ steps.src.outputs.version }}
        run: |
          set -euo pipefail

          echo "Copying ${{ env.BACKEND_IMAGE }}:${BACKEND_TAG} -> prod as ${VERSION}..."
          crane copy \
            ${{ env.SRC_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${BACKEND_TAG} \
            ${{ env.PROD_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${VERSION}
          echo "${{ env.BACKEND_IMAGE }} promoted ✔"

          echo "Copying ${{ env.FRONTEND_IMAGE }}:${FRONTEND_TAG} -> prod as ${VERSION}..."
          crane copy \
            ${{ env.SRC_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${FRONTEND_TAG} \
            ${{ env.PROD_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${VERSION}
          echo "${{ env.FRONTEND_IMAGE }} promoted ✔"

      # ── GitOps : patch values-prod.yaml (réutilise le clone fait
      # plus haut, inutile de re-cloner) ──────────────────────────
      - name: Update prod image tags in repo-config
        env:
          VALUES_FILE: charts/hr-app/values-prod.yaml
          VERSION: ${{ steps.src.outputs.version }}
          GIT_USER_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_USER_NAME: "github-actions[bot]"
        run: |
          set -euo pipefail

          cd config-repo

          yq eval '
            .backend.image.tag = strenv(VERSION) |
            .frontend.image.tag = strenv(VERSION)
          ' -i ${VALUES_FILE}

          echo "Updated values:"
          yq eval '.backend.image.tag, .frontend.image.tag' ${VALUES_FILE}

          git config user.email "${GIT_USER_EMAIL}"
          git config user.name "${GIT_USER_NAME}"

          git add ${VALUES_FILE}

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "ci: promote ${VERSION} to prod"
          git push origin HEAD:main

          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo " Promotion ${VERSION} commitée dans values-prod.yaml."
          echo " hr-prod est maintenant OutOfSync dans ArgoCD."
          echo " Déploiement réel : sync manuel requis"
          echo "   argocd app sync hr-prod    (ou via l'UI ArgoCD)"
          echo "═══════════════════════════════════════════════════════"

name: CI Backend - Build, Test and Push

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read
  id-token: write

env:
  BACKEND_IMAGE: hr-backend

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 - Backend : compile + test + upload JAR
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend - Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrdb
          POSTGRES_USER: hruser
          POSTGRES_PASSWORD: hrpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hruser -d hrdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and Test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hrdb
          DB_USER: hruser
          DB_PASSWORD: hrpass
        run: mvn verify -q

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2 - Docker Build and Push to GCP Artifact Registry
  # ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      # ── Authentification GCP via OIDC ─────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Backend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.image_tag }} \
            ./backend

      - name: Scan Backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push Backend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3 - Deploy : patch le values file GitOps selon la branche
  #   develop -> values-dev.yaml   (namespace dev)
  #   main    -> values-staging.yaml (namespace staging)
  #   (prod est promu par tag via promote-prod.yml, jamais ici)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy - Update GitOps config
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && success()
    env:
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}

    steps:
      - name: Resolve target environment
        id: target
        run: |
          case "${{ github.ref }}" in
            refs/heads/develop)
              echo "values_file=charts/hr-app/values-dev.yaml" >> "$GITHUB_OUTPUT"
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main)
              echo "values_file=charts/hr-app/values-staging.yaml" >> "$GITHUB_OUTPUT"
              echo "environment=staging" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Branche non mappée à un environnement: ${{ github.ref }}"
              exit 1
              ;;
          esac

      # ── Authentification GCP via OIDC ─────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      # ── Token GitHub App (remplace le GH_PAT) — scopé repo-config,
      # expire en 1h, révoqué automatiquement en fin de job ──────
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mariemmehri
          repositories: repo-config

      - name: Update backend image tag in repo-config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_REPO: ${{ vars.CONFIG_REPO }}
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
          VALUES_FILE: ${{ steps.target.outputs.values_file }}
          TARGET_ENV: ${{ steps.target.outputs.environment }}
          GIT_USER_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_USER_NAME: "github-actions[bot]"

        run: |
          set -euo pipefail

          echo "Deploying backend IMAGE_TAG=$IMAGE_TAG to environment=$TARGET_ENV (${VALUES_FILE})"

          echo "Checking backend image.."
          gcloud artifacts docker tags list \
            ${REGISTRY}/${{ env.BACKEND_IMAGE }} \
            --filter="tag:${IMAGE_TAG}" \
            --format="value(tag)" | grep -q "${IMAGE_TAG}"
          echo "Backend image exists ✔"

          git clone --depth 1 \
            https://x-access-token:${GH_TOKEN}@github.com/${CONFIG_REPO}.git \
            config-repo
          cd config-repo

          git config user.email "${GIT_USER_EMAIL}"
          git config user.name "${GIT_USER_NAME}"

          # retry on push conflict: ci-frontend.yml may be updating the
          # same values file concurrently when both sides change together
          for attempt in 1 2 3 4 5; do
            yq eval '.backend.image.tag = strenv(IMAGE_TAG)' -i ${VALUES_FILE}

            echo "Updated backend.image.tag:"
            yq eval '.backend.image.tag' ${VALUES_FILE}

            git add ${VALUES_FILE}

            if git diff --cached --quiet; then
              echo "No changes"
              break
            fi

            git commit -m "ci: update ${TARGET_ENV} backend image tag to ${IMAGE_TAG}"

            if git push origin HEAD:main; then
              echo "GitOps update completed ✔ (${TARGET_ENV})"
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push after 5 attempts (concurrent update from ci-frontend?)"
              exit 1
            fi

            echo "Push rejected, retrying ($attempt/5)..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 3))
          done

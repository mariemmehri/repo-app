server.port=8081
spring.application.name=hr-backend

# DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrdb}
spring.datasource.username=${DB_USER:hruser}
spring.datasource.password=${DB_PASSWORD:hrpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator / Micrometer — additive to /api/health-check (the K8s probe target,
# untouched); /actuator/prometheus is the scrape endpoint the monitoring
# ServiceMonitor reads, same port (8081) as the rest of the API so no new
# NetworkPolicy port is needed, only a new ingress source (see
# networkpolicy-backend.yaml in repo-config).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
